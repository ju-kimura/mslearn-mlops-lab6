name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/train-dev.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  train-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Configure Azure ML workspace
        id: detect
        run: |
          SUBSCRIPTION_ID="8d2804bb-2fc3-4151-8bd0-aef7dae18d25"
          RG_NAME="rg-ai300-lab6-payg"
          WS_NAME="mlw-ai300-lab6-payg"
          ENDPOINT_NAME="diabetes-endpoint-lab6-payg"

          az account set --subscription "$SUBSCRIPTION_ID"
          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"
          az ml workspace show --name "$WS_NAME" --resource-group "$RG_NAME" --query name -o tsv

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "endpoint_name=$ENDPOINT_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in dev
        id: train
        run: |
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Running Azure ML job in dev: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder@latest \
            --query name -o tsv

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for dev training job
        timeout-minutes: 60
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"

          while true; do
            STATUS=$(az ml job show \
              --name "$JOB_NAME" \
              --query status \
              --output tsv)

            echo "Job status: $STATUS"

            case "$STATUS" in
              Completed)
                echo "Dev training completed successfully."
                break
                ;;
              Failed|Canceled|NotResponding)
                echo "Dev training did not complete successfully: $STATUS" >&2
                exit 1
                ;;
              "")
                echo "Could not retrieve job status." >&2
                exit 1
                ;;
              *)
                sleep 30
                ;;
            esac
          done





      - name: Download dev training outputs
        id: download
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          mkdir -p downloaded-job
          az ml job download --name "$JOB_NAME" --output-name metrics_output --download-path downloaded-job

          METRICS_FILE=$(find downloaded-job -name metrics.json | head -n 1)
          if [ -z "$METRICS_FILE" ]; then
            echo "Downloaded files:" >&2
            find downloaded-job -maxdepth 5 -type f | sort >&2 || true
            echo "No metrics.json found in downloaded job outputs." >&2
            exit 1
          fi

          STUDIO_URL=$(az ml job show --name "$JOB_NAME" --query services.Studio.endpoint -o tsv)

          echo "metrics_file=$METRICS_FILE" >> "$GITHUB_OUTPUT"
          echo "studio_url=$STUDIO_URL" >> "$GITHUB_OUTPUT"

      - name: Extract dev metrics from output artifact
        id: parse-metrics
        run: |
          if [ ! -f "${{ steps.download.outputs.metrics_file }}" ]; then
            echo "No metrics file found to parse." >&2
            exit 1
          fi

          ACC=$(python -c "import json; print(json.load(open(r'${{ steps.download.outputs.metrics_file }}', encoding='utf-8'))['accuracy'])")
          AUC=$(python -c "import json; print(json.load(open(r'${{ steps.download.outputs.metrics_file }}', encoding='utf-8'))['auc'])")

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment dev metrics on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';
            const jobName = '${{ steps.train.outputs.job_name }}';
            const studioUrl = '${{ steps.download.outputs.studio_url }}';

            const prNumber = context.issue.number;

            let body = '✅ Dev training workflow completed.';
            body += '\n\n**Azure ML job**';
            body += `\n- Name: ${jobName}`;
            if (studioUrl) body += `\n- Studio: ${studioUrl}`;

            body += '\n\n**Dev evaluation metrics**';
            body += `\n- Accuracy: ${acc}`;
            body += `\n- AUC: ${auc}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
